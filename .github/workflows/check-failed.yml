name: Check Failed

on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]

jobs:
  comment-on-failure:
    # Run if either a check_run or check_suite completed with conclusion 'failure'
    # and there is at least one associated pull request
    runs-on: ubuntu-latest

    steps:
      - name: Debug show event payload (first 2000 chars)
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Event path: $GITHUB_EVENT_PATH"
          head -n 2000 "$GITHUB_EVENT_PATH" || true

      - name: Determine PR URL and conclusion
        id: get_info
        run: |
          event="$GITHUB_EVENT_PATH"
          # Prefer check_run.pull_requests, then check_run.check_suite.pull_requests, then check_suite.pull_requests
          pr_url=$(jq -r 'if .check_run and (.check_run.pull_requests|length > 0) then .check_run.pull_requests[0].html_url elif .check_run and .check_run.check_suite and (.check_run.check_suite.pull_requests|length > 0) then .check_run.check_suite.pull_requests[0].html_url elif .check_suite and (.check_suite.pull_requests|length > 0) then .check_suite.pull_requests[0].html_url else "" end' "$event")
          conclusion=$(jq -r 'if .check_run then .check_run.conclusion elif .check_suite then .check_suite.conclusion else "" end' "$event")
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT
          echo "Determined pr_url=$pr_url conclusion=$conclusion"

      - name: Post failure comment
        if: ${{ steps.get_info.outputs.conclusion == 'failure' && steps.get_info.outputs.pr_url != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ⚠️ Some checks have failed. Please review the details below:
    
            • View the PR: ${{ steps.get_info.outputs.pr_url }}
            • View the failing check details on the Checks tab for that PR.
          hide_and_recreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
