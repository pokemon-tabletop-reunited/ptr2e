name: Check Failed
# If the check suite completes for a PR and has failed, run this workflow
# Post a comment on the PR indicating that some checks have failed

on:
  check_run:
    types: [completed]

jobs:
  comment-on-failure:
    if: ${{ github.event.check_run.conclusion == 'failure' && github.event.check_suite.pull_requests[0] != null }}
    runs-on: ubuntu-latest

    steps:
      - name: Post failure comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ⚠️ Some checks have failed. Please review the details below:

            • View the PR and its checks: ${{ github.event.check_run.html_url }}
            Please address the issues and push new commits to trigger a new check run.
          hide_and_recreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
