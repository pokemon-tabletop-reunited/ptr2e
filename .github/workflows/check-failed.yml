name: Check Failed

on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]

jobs:
  comment-on-failure:
    # Run if either a check_run or check_suite completed with conclusion 'failure'
    # and there is at least one associated pull request
    if: ${{ (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && length(github.event.check_run.pull_requests) > 0) || (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'failure' && length(github.event.check_suite.pull_requests) > 0) }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug print event name and limited payload
        run: |
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-$GITHUB_EVENT_NAME}"
          echo "Event name: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "check_run" ]; then
            echo "Check run conclusion: ${{ github.event.check_run.conclusion }}"
            echo "Pull requests length: ${{ length(github.event.check_run.pull_requests) }}"
          else
            echo "Check suite conclusion: ${{ github.event.check_suite.conclusion }}"
            echo "Pull requests length: ${{ length(github.event.check_suite.pull_requests) }}"
          fi

      - name: Post failure comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ⚠️ Some checks have failed. Please review the details below:

            • View the check: ${{ github.event.check_run.html_url || github.event.check_suite.html_url }}
            Please address the issues and push new commits to trigger a new check run.
          hide_and_recreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
