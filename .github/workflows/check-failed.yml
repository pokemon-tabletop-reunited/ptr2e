name: Check Failed

on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]

jobs:
  comment-on-failure:
    # Run if either a check_run or check_suite completed with conclusion 'failure'
    # and there is at least one associated pull request
    if: ${{ (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && github.event.check_run.pull_requests[0] != null) || (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'failure' && github.event.check_suite.pull_requests[0] != null) }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug show event payload (first 2000 chars)
        run: |
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-$GITHUB_EVENT_NAME}"
          echo "Event file: $GITHUB_EVENT_PATH"
          # Show a limited amount of the event file for debugging
          head -n 2000 "$GITHUB_EVENT_PATH" || true

      - name: Post failure comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ⚠️ Some checks have failed. Please review the details below:

            • View the PR: ${{ github.event_name == 'check_run' ? github.event.check_run.pull_requests[0].html_url : github.event_name == 'check_suite' ? github.event.check_suite.pull_requests[0].html_url : '' }}
            • View the failing check details on the Checks tab for that PR.
            Please address the issues and push new commits to trigger a new check run.
          hide_and_recreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
