name: Check Failed -> Post Comment

on:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [PTR2e CI]
    types: [completed]

jobs:
  comment-on-failure:
    # Run if either a check_run or check_suite completed with conclusion 'failure'
    # and there is at least one associated pull request
    runs-on: ubuntu-latest

    steps:
      - name: Debug show event payload (first 2000 chars)
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Event path: $GITHUB_EVENT_PATH"
          head -n 2000 "$GITHUB_EVENT_PATH" || true

      - name: Determine PR URL and conclusion
        id: get_info
        run: |
          event="$GITHUB_EVENT_PATH"
          # Try multiple places for PR association and conclusion:
          # 1) check_run.pull_requests
          # 2) check_run.check_suite.pull_requests
          # 3) check_suite.pull_requests
          # 4) workflow_run.pull_requests
          pr_url=$(jq -r '
            if (.check_run and (.check_run.pull_requests | length) > 0) then .check_run.pull_requests[0].html_url
            elif (.check_run and .check_run.check_suite and (.check_run.check_suite.pull_requests | length) > 0) then .check_run.check_suite.pull_requests[0].html_url
            elif (.check_suite and (.check_suite.pull_requests | length) > 0) then .check_suite.pull_requests[0].html_url
            elif (.workflow_run and (.workflow_run.pull_requests | length) > 0) then .workflow_run.pull_requests[0].html_url
            else "" end' "$event")

          pr_number=$(jq -r '
            if (.check_run and (.check_run.pull_requests | length) > 0) then .check_run.pull_requests[0].number
            elif (.check_run and .check_run.check_suite and (.check_run.check_suite.pull_requests | length) > 0) then .check_run.check_suite.pull_requests[0].number
            elif (.check_suite and (.check_suite.pull_requests | length) > 0) then .check_suite.pull_requests[0].number
            elif (.workflow_run and (.workflow_run.pull_requests | length) > 0) then .workflow_run.pull_requests[0].number
            else "" end' "$event")

          conclusion=$(jq -r '
            if .check_run then .check_run.conclusion
            elif .check_suite then .check_suite.conclusion
            elif .workflow_run then .workflow_run.conclusion
            else "" end' "$event")

          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          echo "Determined pr_url=${pr_url}, number=${pr_number}, conclusion=${conclusion}"
          
      - name: Post failure comment
        if: ${{ steps.get_info.outputs.conclusion == 'failure' && steps.get_info.outputs.pr_url != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.get_info.outputs.pr_number }}
          message: |
            ⚠️ Some checks have failed. Please review the details below:
    
            • View the PR: ${{ steps.get_info.outputs.pr_url }}
            • View the failing check details on the Checks tab for that PR.
          hide_and_recreate: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
